<!DOCTYPE html>
<html>
<head>
  <title>Unsaid Universe</title>

  <link rel="stylesheet" href="css/style.css">

  <!-- description -->
  <meta name="description" content="Unsaid Universe is a location-based social platform where users can anonymously share thoughts on a map and interact through comments in real-time.">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- LEAFLET -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

  <!-- TWEMOJI -->
  <link rel="icon" href="https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/svg/1f9e0.svg" type="image/svg+xml">

  <!-- CLUSTER -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.css"/>
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.Default.css"/>
</head>
<body>

<div class="stars"></div>

<div id="header"></div>

<div class="container">
  <h3>🌍 Tap anywhere on the map to post</h3>
  <div id="map"></div>
</div>

<div id="footer"></div>

<!-- MODAL -->
<div id="modal" class="modal">
  <div class="modal-content">
    <h3>💭 Your Thought</h3>
    <textarea id="thought" placeholder="Write something..."></textarea>
    <button onclick="submitPost()">🚀 Post</button>
    <button onclick="closeModal()">Cancel</button>
  </div>
</div>

<!-- 🌌 WELCOME POPUP (NEW) -->
<div id="welcomePopup" class="welcome-popup">
  <div class="welcome-box">
    <h2>🌌 Welcome</h2>
    <p id="typingText"></p>
    <button onclick="closeWelcome()">Enter</button>
  </div>
</div>

<!-- LEAFLET -->
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster/dist/leaflet.markercluster.js"></script>

<script type="module" src="js/app.js"></script>

<script>
fetch('include/header.html')
.then(res => res.text())
.then(data => document.getElementById('header').innerHTML = data);

fetch('include/footer.html')
.then(res => res.text())
.then(data => document.getElementById('footer').innerHTML = data);
</script>

</body>
</html>
