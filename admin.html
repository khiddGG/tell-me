<!DOCTYPE html>
<html>
<head>
  <title>Admin Panel | Unsaid Universe</title>
  <link rel="stylesheet" href="css/style.css">

  <style>
    body{
      background:#0b0f1a;
      color:#fff;
    }

    .admin-container{
      padding:20px;
      display:none;
    }

    .post-card{
      background:#111827;
      padding:15px;
      border-radius:12px;
      margin-bottom:10px;
    }

    .login-box{
      position:fixed;
      width:100%;
      height:100%;
      display:flex;
      justify-content:center;
      align-items:center;
      background:#000;
    }

    .box{
      background:#111;
      padding:20px;
      border-radius:10px;
      width:280px;
    }

    input{
      width:100%;
      padding:8px;
      margin-top:10px;
    }

    button{
      width:100%;
      margin-top:10px;
      padding:8px;
      background:#0ea5e9;
      border:none;
      color:#fff;
      cursor:pointer;
    }
  </style>
</head>
<body>

<div id="loginBox" class="login-box">
  <div class="box">
    <h3>🔐 Admin Login</h3>
    <input type="email" id="email" placeholder="Email">
    <input type="password" id="password" placeholder="Password">
    <button onclick="login()">Login</button>
    <p id="error" style="color:red;"></p>
  </div>
</div>

<div id="adminContent" class="admin-container">
  <h2>🧠 Admin Panel</h2>
  <div id="posts"></div>
</div>

<script type="module" src="js/admin.js"></script>

</body>
</html>
